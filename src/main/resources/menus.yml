# AlkaRankUp - menus.yml
# Nome/lore de todas as GUIs ja vivem em messages.yml (chaves "gui.*") desde antes deste
# retrofit R8 - ja eram 100% editaveis sem recompilar, so o MATERIAL do icone e a POSICAO
# do slot (agora em gui-layouts.yml) estavam hardcoded em Java. Este arquivo cobre só o
# material dos icones estaticos (decoracao/botoes); icones dinamicos (rank/kit/cabeca por
# tipo, que ja tem seu proprio material configuravel em outro lugar) continuam montados em
# Java. Chave = <id-do-layout>.<chave>.material, casada com a letra usada em gui-layouts.yml.

rankup_main:
  filler:
    material: GRAY_STAINED_GLASS_PANE
  heads:
    material: SKELETON_SKULL
  ranks:
    material: BOOK
  profile:
    material: PLAYER_HEAD
  top:
    material: GOLD_BLOCK
  rankup:
    material: EXPERIENCE_BOTTLE

rankup_heads:
